<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}' blob:; worker-src blob:; connect-src {{CSP}}; img-src {{CSP}} data:;">
  <title>Kieran EEG Viewer · 波形与 PSD</title>
  <link rel="stylesheet" href="{{STYLE}}">
</head>
<body data-worker="{{WORKER}}" data-dsp="{{DSP}}">
  <div class="app sidebar-collapsed">
    <aside id="sidebar" class="sidebar" hidden>
      <div id="sidebar-content" class="sidebar-content">
        <div class="brand"><img class="brand-mark" src="{{ICON}}" alt="Kieran EEG Viewer Logo"><strong>Kieran EEG Viewer</strong><span class="version">{{VERSION}}</span></div>
        <div class="source-controls">
          <label for="profile">数据模式</label>
          <div class="mode-row"><select id="profile"><option value="ssvep">SSVEP</option><option value="assr">ASSR</option></select><button id="refresh" title="刷新" aria-label="刷新">↻</button></div>
        </div>
        <div class="explorer-heading"><span>实验记录</span><span id="record-count" class="count">0</span></div>
        <div id="session-list" class="session-list"></div>
        <div class="trial-browser" hidden>
          <label for="search" class="sr-only">筛选条件或 trial</label><input id="search" type="search" placeholder="筛选频率、条件或 trial…">
          <label class="checkbox muted"><input id="valid-only" type="checkbox">仅显示采集标记有效</label>
          <div id="trial-list" class="trial-list" role="list" aria-label="实验区间"></div>
        </div>
      </div>
    </aside>
    <main>
      <header class="page-header">
        <div class="page-heading"><button id="toggle-sidebar" class="sidebar-toggle" aria-label="展开侧栏" title="展开侧栏" aria-expanded="false" aria-controls="sidebar">›</button><div><div class="eyebrow" id="breadcrumb"></div><h1 id="record-title">EEG</h1><div id="record-subtitle" class="muted"></div></div></div>
        <div class="header-actions"><button id="previous" disabled aria-label="上一个 trial" title="上一个 trial（Alt + ←）">←</button><button id="next" disabled aria-label="下一个 trial" title="下一个 trial（Alt + →）">→</button><button id="export-png" disabled>导出图像</button></div>
      </header>
      <div id="notice" class="notice" role="status" hidden></div>
      <div id="workspace" data-state="loading" hidden>
        <div class="signal-toolbar">
          <select id="wave-mode" aria-label="波形视图"><option value="average" selected>三通道平均</option><option value="channels">分别显示</option></select>
          <label>信号<select id="signal-mode"><option value="raw">原始</option><option value="filtered">通用滤波</option><option value="ssvep" selected>SSVEP 6–35 Hz</option></select></label>
          <label class="filter-control" hidden>带通<input id="highpass" type="number" value="0.5" min="0.01" step="0.1" aria-label="带通下限 Hz">—<input id="lowpass" type="number" value="60" min="1" step="1" aria-label="带通上限 Hz">Hz</label>
          <label id="notch-control" class="checkbox" hidden><input id="notch" type="checkbox">50 Hz 陷波</label>
          <label class="checkbox"><input id="center-wave" type="checkbox" checked>居中显示</label>
          <label>纵轴<select id="amplitude"><option value="auto">自动</option><option value="50">±50</option><option value="100">±100</option><option value="250">±250</option><option value="500">±500</option><option value="1000">±1000</option></select></label>
        </div>
        <section class="plot-card waveform-card">
          <div class="card-header"><div><h2>EEG 波形</h2><span id="wave-unit" class="pill">μV</span></div><div class="plot-actions"><span id="view-range"></span><button id="zoom-selection" disabled>放大选区</button><button id="zoom-in">＋</button><button id="zoom-out">−</button><button id="reset-view">全段</button><button id="clear-selection" disabled>清除选区</button></div></div>
          <div id="timeline" class="timeline" role="group" aria-label="全记录时间导航" hidden>
            <div id="timeline-events" class="timeline-events"></div>
            <div id="timeline-view" class="timeline-view" role="slider" aria-label="EEG 时间窗口" aria-orientation="horizontal" tabindex="-1"></div>
          </div>
          <div class="canvas-wrap" id="wave-wrap" data-view="average"><canvas id="wave" aria-label="EEG 波形"></canvas><div id="wave-tooltip" class="tooltip" hidden></div></div>
          <div class="plot-footer" id="selection-footer" hidden><span id="selection-label"></span></div>
        </section>
        <section class="plot-card psd-card">
          <div class="card-header"><div><h2>PSD</h2><div id="channels" class="channels"></div></div><div class="plot-actions"><button id="reset-psd" disabled>全频段</button><button id="pin">固定为对照 A</button><button id="clear-pin" hidden>移除 A</button><button id="export-csv">导出 PSD</button></div></div>
          <div class="psd-toolbar">
            <label>来源<select id="psd-source"><option value="segment">完整 trial</option><option id="source-event" value="event" disabled hidden>当前事件</option><option id="source-selection" value="selection" disabled>框选区间</option></select></label>
            <label>纵轴<select id="psd-scale"><option value="db">dB</option><option value="linear">线性</option></select></label>
            <details class="psd-advanced"><summary>高级</summary><div>
              <label>算法<select id="psd-method"><option value="full">整段</option><option value="welch" selected>Welch 平均</option></select></label>
              <label class="welch-control">窗长<select id="window"><option value="2">2 s</option><option value="4" selected>4 s</option><option value="8">8 s</option></select></label>
              <label class="welch-control">重叠<select id="overlap"><option value="0.5" selected>50%</option><option value="0">0%</option><option value="0.75">75%</option></select></label>
              <label>单位<select id="signal-units"><option value="metadata" selected>元数据换算</option><option value="raw">采集原值</option></select></label>
              <label>缺失点<select id="missing"><option value="preserve">保留缺口</option><option value="interpolate" selected>线性插值</option></select></label>
            </div></details>
          </div>
          <div class="canvas-wrap" id="psd-wrap"><canvas id="psd" aria-label="各通道 PSD" title="滚轮缩放 · 拖动平移 · 双击恢复全频段"></canvas><div id="psd-tooltip" class="tooltip" hidden></div></div>
          <div class="plot-footer"><span id="psd-info">等待数据</span><span id="compute-status" role="status"></span></div>
          <div id="pin-info" class="pin-info" hidden></div>
        </section>
        <details class="details-card" open><summary>详情</summary><div id="details"></div></details>
      </div>
    </main>
  </div>
  <script nonce="{{NONCE}}" src="{{PREFERENCES}}"></script>
  <script nonce="{{NONCE}}" src="{{APP}}"></script>
</body>
</html>
