name: Package and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    name: Build VSIX and publish GitHub release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const expected = 'v' + require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Tag must match package version ' + expected)"
      - name: Build extension
        run: npm run package -- --out kieran-eeg-viewer.vsix
      - name: Generate SHA256 checksum
        run: node scripts/write-checksums.cjs kieran-eeg-viewer.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kieran-eeg-viewer
          path: |
            kieran-eeg-viewer.vsix
            SHA256SUMS.txt
      - name: Publish preview release on GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" kieran-eeg-viewer.vsix SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease \
            --title "Kieran EEG Viewer $GITHUB_REF_NAME" \
            --notes-file release.md
